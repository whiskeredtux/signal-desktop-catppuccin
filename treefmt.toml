on-unmatched = "info"
tree-root-file = "release.json"

[formatter.nixfmt]
command = "nixfmt"
includes = [ "*.nix" ]

[formatter.deadnix]
command = "deadnix"
options = [ "--edit", ]
includes = [ "*.nix" ]

[formatter.nixf-diagnose]
command = "nixf-diagnose"
options = [
  "--auto-fix",

]
includes = [ "*.nix" ]

[formatter.keep-sorted]
command = "keep-sorted"
includes = [ "*" ]
